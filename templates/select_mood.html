{% extends "base.html" %}

{% block title %} · Pilih Mood{% endblock %}

{% block content %}
<div class="select-mood-page">
    <div class="select-mood-header">
        <span class="accent-sparkle">✦ Ceritakan Harimu ✧</span>
        <h1 class="select-mood-title">What's your mood today??</h1>
        <p class="select-mood-desc">
            Bagaimana perasaanmu saat ini? Pilih salah satu mood di bawah untuk mempersonalisasi rekomendasi bukumu hari ini.
        </p>
    </div>

    <form action="/select_mood" method="POST" class="mood-selection-grid">
        <button type="submit" name="mood" value="Happy/Funny" class="mood-card-btn mood-happy">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">😊</span>
                <h3 class="mood-card-name">Happy / Funny</h3>
                <p class="mood-card-tagline">Ceria, penuh tawa, &amp; menghibur</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Heartwarming" class="mood-card-btn mood-heartwarming">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">❤️</span>
                <h3 class="mood-card-name">Heartwarming</h3>
                <p class="mood-card-tagline">Hangat, menyentuh hati, &amp; manis</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Hopeful" class="mood-card-btn mood-hopeful">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">✨</span>
                <h3 class="mood-card-name">Hopeful</h3>
                <p class="mood-card-tagline">Penuh harapan, optimisme, &amp; mimpi</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Inspiring" class="mood-card-btn mood-inspiring">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">🌟</span>
                <h3 class="mood-card-name">Inspiring</h3>
                <p class="mood-card-tagline">Memotivasi &amp; membuka pikiran</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Reflective" class="mood-card-btn mood-reflective">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">💭</span>
                <h3 class="mood-card-name">Reflective</h3>
                <p class="mood-card-tagline">Kontemplatif &amp; penuh perenungan</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Emotional" class="mood-card-btn mood-emotional">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">🥺</span>
                <h3 class="mood-card-name">Emotional</h3>
                <p class="mood-card-tagline">Penuh emosi, haru, &amp; perasaan</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Sad" class="mood-card-btn mood-sad">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">😢</span>
                <h3 class="mood-card-name">Sad</h3>
                <p class="mood-card-tagline">Melankolis, sedih, &amp; sendu</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Suspenseful" class="mood-card-btn mood-suspenseful">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">🫣</span>
                <h3 class="mood-card-name">Suspenseful</h3>
                <p class="mood-card-tagline">Tegang, penuh misteri, &amp; teka-teki</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Thrilling" class="mood-card-btn mood-thrilling">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">⚡</span>
                <h3 class="mood-card-name">Thrilling</h3>
                <p class="mood-card-tagline">Mendebarkan, seru, &amp; memacu adrenalin</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>

        <button type="submit" name="mood" value="Dark" class="mood-card-btn mood-dark">
            <div class="mood-card-inner">
                <span class="mood-card-emoji">🖤</span>
                <h3 class="mood-card-name">Dark</h3>
                <p class="mood-card-tagline">Kelam, misterius, &amp; mendalam</p>
            </div>
            <div class="mood-card-hover-border"></div>
        </button>
    </form>
</div>
{% endblock %}
